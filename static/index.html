<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VAIV - AI Chatbot</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #fce7f3;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        /* CHAT CONTAINER */

        .chat-container {

            width: 600px;
            height: 720px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 12px 45px rgba(190, 24, 93, 0.18);

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* HEADER */

        .header {

            background: linear-gradient(
                135deg,
                #db2777,
                #ec4899
            );

            color: white;

            padding: 18px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {

            font-size: 22px;

            font-weight: bold;
        }

        .status {

            font-size: 12px;

            color: #fce7f3;

            margin-top: 4px;
        }

        /* NEW CHAT BUTTON */

        .new-chat {

            background: rgba(255, 255, 255, 0.2);

            color: white;

            border: 1px solid rgba(255, 255, 255, 0.35);

            padding: 9px 14px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;
        }

        .new-chat:hover {

            background: rgba(255, 255, 255, 0.3);
        }

        /* CHAT AREA */

        #chat-box {

            flex: 1;

            padding: 20px;

            overflow-y: auto;

            background: #fff7fb;
        }

        /* MESSAGE */

        .message {

            margin-bottom: 15px;

            padding: 12px 15px;

            border-radius: 14px;

            max-width: 80%;

            line-height: 1.5;

            word-wrap: break-word;
        }

        /* USER MESSAGE */

        .user {

            background: #ec4899;

            color: white;

            margin-left: auto;

            border-bottom-right-radius: 4px;
        }

        /* BOT MESSAGE */

        .bot {

            background: #fce7f3;

            color: #831843;

            margin-right: auto;

            border-bottom-left-radius: 4px;
        }

        /* TYPING INDICATOR */

        .typing {

            display: inline-flex;

            gap: 4px;

            align-items: center;
        }

        .typing span {

            width: 6px;

            height: 6px;

            background: #ec4899;

            border-radius: 50%;

            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {

            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {

            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%, 60%, 100% {

                opacity: 0.3;

                transform: translateY(0);
            }

            30% {

                opacity: 1;

                transform: translateY(-3px);
            }
        }

        /* INPUT AREA */

        .input-area {

            display: flex;

            gap: 10px;

            padding: 15px;

            background: white;

            border-top: 1px solid #fbcfe8;
        }

        #message {

            flex: 1;

            padding: 13px;

            border: 1px solid #f9a8d4;

            border-radius: 10px;

            outline: none;

            font-size: 15px;
        }

        #message:focus {

            border-color: #ec4899;

            box-shadow:
                0 0 0 3px rgba(236, 72, 153, 0.1);
        }

        /* SEND BUTTON */

        .send-button {

            background: #db2777;

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;
        }

        .send-button:hover {

            background: #be185d;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .chat-container {

                width: 95%;

                height: 90vh;
            }
        }

    </style>

</head>


<body>


<div class="chat-container">


    <!-- HEADER -->

    <div class="header">

        <div>

            <div class="title">

                💗 VAIV

            </div>

            <div class="status">

                Your Local AI Assistant

            </div>

        </div>


        <button
            class="new-chat"
            onclick="newChat()">

            + New Chat

        </button>

    </div>


    <!-- CHAT AREA -->

    <div id="chat-box">

        <div class="message bot">

            Hey! 👋 I'm VAIV.
            How can I help you today? 💗

        </div>

    </div>


    <!-- INPUT AREA -->

    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Message VAIV..."
            onkeydown="handleKey(event)"
        >

        <button
            class="send-button"
            onclick="sendMessage()">

            Send

        </button>

    </div>


</div>



<script>


/* ============================= */
/* SEND MESSAGE */
/* ============================= */

async function sendMessage() {

    const input =
        document.getElementById("message");

    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    // Show user message

    addMessage(
        message,
        "user"
    );


    // Clear input

    input.value = "";


    // Show typing animation

    const thinkingMessage =
        addTypingIndicator();


    try {


        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    message: message

                })

            });


        const data =
            await response.json();


        // Replace typing animation
        // with actual AI response

        thinkingMessage.textContent =
            data.bot;


    }


    catch (error) {


        thinkingMessage.textContent =
            "Sorry, something went wrong. Please try again.";


    }

}



/* ============================= */
/* TYPING INDICATOR */
/* ============================= */

function addTypingIndicator() {

    const chatBox =
        document.getElementById("chat-box");


    const messageDiv =
        document.createElement("div");


    messageDiv.classList.add(
        "message",
        "bot"
    );


    messageDiv.innerHTML = `

        <span class="typing">

            <span></span>

            <span></span>

            <span></span>

        </span>

    `;


    chatBox.appendChild(
        messageDiv
    );


    chatBox.scrollTop =
        chatBox.scrollHeight;


    return messageDiv;

}



/* ============================= */
/* ADD MESSAGE */
/* ============================= */

function addMessage(
    text,
    sender
) {

    const chatBox =
        document.getElementById("chat-box");


    const messageDiv =
        document.createElement("div");


    messageDiv.classList.add(
        "message",
        sender
    );


    messageDiv.textContent =
        text;


    chatBox.appendChild(
        messageDiv
    );


    chatBox.scrollTop =
        chatBox.scrollHeight;


    return messageDiv;

}



/* ============================= */
/* ENTER KEY */
/* ============================= */

function handleKey(event) {

    if (
        event.key === "Enter"
    ) {

        sendMessage();

    }

}



/* ============================= */
/* NEW CHAT */
/* ============================= */

async function newChat() {


    try {


        await fetch(
            "/clear",
            {

                method: "POST"

            }
        );


        document.getElementById(
            "chat-box"
        ).innerHTML = `

            <div class="message bot">

                New conversation started! 👋
                I'm VAIV.
                How can I help you? 💗

            </div>

        `;


    }


    catch (error) {


        console.error(
            "Error starting new chat:",
            error
        );


    }

}


</script>


</body>

</html>
